<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signup | Blood Bank</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
  background: linear-gradient(135deg,#7f1d1d,#dc2626,#ef4444);
}
.glass{
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
}
</style>
</head>

<body class="flex items-center justify-center h-screen">

<div class="glass p-8 rounded-2xl w-full max-w-md text-white">

<h1 class="text-3xl font-bold text-center mb-4">🩸 Signup</h1>

<input id="email" type="email" placeholder="Email"
class="w-full p-3 mb-3 rounded text-black">

<input id="password" type="password" placeholder="Password"
class="w-full p-3 mb-3 rounded text-black">

<button onclick="signup()"
class="w-full bg-white text-red-600 font-bold p-3 rounded">
Signup
</button>

<p id="msg" class="text-center mt-3 text-sm"></p>

<p class="text-center mt-4">
Already have account?
<a href="login.html" class="underline">Login</a>
</p>

</div>

<script>

function signup(){

let email = document.getElementById("email").value;
let pass = document.getElementById("password").value;
let msg = document.getElementById("msg");

if(email=="" || pass==""){
msg.innerText="❌ Fill all fields";
return;
}

let users = JSON.parse(localStorage.getItem("users")) || [];

let exists = users.find(u => u.email === email);

if(exists){
msg.innerText="❌ User already exists";
return;
}

users.push({email, pass});
localStorage.setItem("users", JSON.stringify(users));

msg.innerText="✅ Signup successful";

setTimeout(()=>{
window.location.href="login.html";
},1000);
}

</script>

</body>
</html>
